name: Deploy to AWS S3 and Cloudfront

on:
  push:
    branches:
      - master-aws

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ap-south-1
  S3_BUCKET_NAME: aws.kesowa.com
  S3_ENDPOINT_URL: http://aws.kesowa.com.s3-website.ap-south-1.amazonaws.com
  DISTRIBUTION_ID: E11284CPOQHLHM
  DISTRIBUTION_URL: https://d25g9bq6hvfa5.cloudfront.net

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: npm install

      - name: Set up environment variables
        run: |
          echo "CLIENT_URL=${{ secrets.CLIENT_URL }}" >> .env
          echo "VITE_MAPBOX_API_KEY=${{ secrets.VITE_MAPBOX_API_KEY }}" >> .env
          echo "VITE_SECRET_KEY=${{ secrets.VITE_SECRET_KEY }}" >> .env
          echo "VITE_SITE_KEY=${{ secrets.VITE_SITE_KEY }}" >> .env
          echo "VITE_VERSION=${{ secrets.VITE_VERSION }}" >> .env

      - name: Build React app
        run: npm run build

      - name: Deploy to S3
        run: |
          aws s3 sync build/ s3://${{ env.S3_BUCKET_NAME }} --delete
          echo "App deployed at ${{ env.S3_ENDPOINT_URL }}"

      - name: Invalidate Cloudfront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ env.DISTRIBUTION_ID }} --paths "/*"
          echo "Cloudfront cache invalidated for ${{ env.DISTRIBUTION_URL }}"

      # - name: Configure S3 bucket
