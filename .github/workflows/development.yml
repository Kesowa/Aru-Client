name: Deploy to AWS S3 and Cloudfront

on:
  push:
    branches:
      - dev

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: us-west-2
  S3_BUCKET_NAME: my-s3-bucket
  S3_ENDPOINT_URL: http://my-s3-bucket.s3-website-us-west-2.amazonaws.com
  DISTRIBUTION_ID: my-cloudfront-distribution-id
  DISTRIBUTION_URL: https://my-cloudfront-distribution.cloudfront.net

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Deploy to S3
        run: |
          aws s3 sync build/ s3://${{ env.S3_BUCKET_NAME }} --delete
          echo "App deployed at ${{ env.S3_ENDPOINT_URL }}"

      - name: Invalidate Cloudfront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ env.DISTRIBUTION_ID }} --paths "/*"
          echo "Cloudfront cache invalidated for ${{ env.DISTRIBUTION_URL }}"

      - name: Configure S3 bucket
        run: |
          aws s3api put-bucket-policy --bucket ${{ env.S3_BUCKET_NAME }} --policy file://bucket-policy.json
          aws s3api put-bucket-website --bucket ${{ env.S3_BUCKET_NAME }} --website-configuration file://website-config.json

      - name: Configure Cloudfront distribution
        run: |
          aws cloudfront update-distribution --id ${{ env.DISTRIBUTION_ID }} --distribution-config file://distribution-config.json
