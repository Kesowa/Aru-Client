server {
	listen 80;

	root /usr/share/nginx/html;
	index index.html;
	
	location / {
		try_files $uri $uri/ /index.html;
		include /etc/nginx/conf.d/csp_headers.conf;
	}

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|ttf|woff|woff2)$ {
    expires 30d;
    add_header cache-control "public, max-age=2592000, immutable";
    try_files $uri /index.html =404;
  }
  
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_vary on;

  server_tokens off; # disable sending server and OS info
  add_header x-frame-options "ALLOWALL" always;  # Allow iframe embedding
  add_header x-content-type-options "nosniff" always;
  add_header x-xss-protection "1; mode=block" always;
  add_header referrer-policy "strict-origin-when-cross-origin" always;

  # If the request includes a dotfile (hidden file) or BitKeeper file, deny access
  location ~ /(\.|BitKeeper) {
      deny all;
  }
}
